spring:
  application:
    name: fanchart
  datasource:
    # 세션 상태를 드라이버가 기억해 트랜잭션마다 도는 SET autocommit 왕복을 줄이고, 원장 분개 일괄 저장을 한 문장으로 보낸다.
    # 서버 측 준비문을 캐시한다. 측정과 근거는 docs/performance.md
    url: jdbc:mysql://localhost:3306/teamtrading?useLocalSessionState=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250
    username: teamtrading
    password: teamtrading
server:
  port: 8080
# 운영 지표와 상태 확인은 별도 포트(8081)로만 연다. 이 포트는 외부에 공개하지 않고 내부 네트워크의 Prometheus만 읽는다
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: [health, prometheus]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: [50ms, 100ms, 250ms, 500ms, 1s]
# 경기 일정·결과 수집(docs/adr/0027, 0028). 키는 제공처마다 하나, 대회는 "어느 제공처의 몇 번 대회인지"만 둔다.
# 키가 없는 제공처의 대회와 enabled: false인 대회만 수집하지 않는다. 대회 번호 확인은 docs/operations.md "경기 데이터 수집"
fanchart:
  match-feed:
    keys:
      api-sports: ${API_SPORTS_KEY:}
      football-data: ${FOOTBALL_DATA_KEY:}
      pandascore: ${PANDASCORE_KEY:}
    competitions:
      # 리그 정규 시즌
      - competition: KBO
        source: api-baseball
        league-id: "5"
      - competition: K_LEAGUE
        source: api-football
        league-id: "292"
      - competition: LCK
        source: pandascore
        league-id: "293"
      - competition: EPL
        source: football-data
        league-id: PL
      - competition: LA_LIGA
        source: football-data
        league-id: PD
      - competition: SERIE_A
        source: football-data
        league-id: SA
      - competition: BUNDESLIGA
        source: football-data
        league-id: BL1
      # 컵대회(번호는 키를 받은 뒤 확인한다). LCK컵·EWC는 PandaScore 번호를 확인한 뒤 더한다
      - competition: MSI
        source: pandascore
        league-id: "300"
      - competition: WORLDS
        source: pandascore
        league-id: "297"
      - competition: UCL
        source: football-data
        league-id: CL
      - competition: UEL
        source: api-football
        league-id: "3"
        season-start-month: 7
      - competition: UECL
