spring:
  application:
    name: fanchart
  datasource:
    # 세션 상태를 드라이버가 기억해 트랜잭션마다 도는 SET autocommit 왕복을 줄이고, 원장 분개 일괄 저장을 한 문장으로 보낸다.
    # 서버 측 준비문을 캐시한다. 측정과 근거는 docs/performance.md
    url: jdbc:mysql://localhost:3306/teamtrading?useLocalSessionState=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250
    username: teamtrading
    password: teamtrading
server:
  port: 8080
# 운영 지표와 상태 확인은 별도 포트(8081)로만 연다. 이 포트는 외부에 공개하지 않고 내부 네트워크의 Prometheus만 읽는다
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: [health, prometheus]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: [50ms, 100ms, 250ms, 500ms, 1s]
# 경기 일정·결과 수집(docs/adr/0027, 0028). 키는 제공처마다 하나, 대회는 "어느 제공처의 몇 번 대회인지"만 둔다.
# 키가 없는 제공처의 대회와 enabled: false인 대회만 수집하지 않는다. 대회 번호 확인은 docs/operations.md "경기 데이터 수집"
fanchart:
  # 닫아 둔 리그(ADR 0033). 받을 경기 데이터가 없는 리그는 정규 시즌을 수집하지 않고 화면의 리그 탭·구단 목록에서 뺀다.
  # KBO는 API-Sports 유료로 데이터를 받게 되면 HIDDEN_LEAGUES에서 빼서 다시 연다(예: HIDDEN_LEAGUES=K_LEAGUE)
  leagues:
    hidden: ${HIDDEN_LEAGUES:KBO,K_LEAGUE}
  match-feed:
    keys:
      api-sports: ${API_SPORTS_KEY:}
      football-data: ${FOOTBALL_DATA_KEY:}
      pandascore: ${PANDASCORE_KEY:}
    competitions:
      # 리그 정규 시즌
      - competition: KBO
        source: api-baseball
        league-id: "5"
      - competition: K_LEAGUE
        source: api-football
        league-id: "292"
      - competition: LCK
        source: pandascore
        league-id: "293"
      - competition: EPL
        source: football-data
        league-id: PL
      - competition: LA_LIGA
        source: football-data
        league-id: PD
      - competition: SERIE_A
        source: football-data
        league-id: SA
      - competition: BUNDESLIGA
        source: football-data
        league-id: BL1
      # NBA는 ESPN(키 없음). 정규 시즌·NBA컵·플레이인·플레이오프 경기가 모두 NBA 대회로 들어온다
      - competition: NBA
        source: espn
        league-id: basketball/nba
      # 컵대회(번호는 키를 받은 뒤 확인한다). LCK컵·EWC는 PandaScore 번호를 확인한 뒤 더한다
      - competition: MSI
        source: pandascore
        league-id: "300"
      - competition: WORLDS
        source: pandascore
        league-id: "297"
      - competition: UCL
        source: football-data
        league-id: CL
      # 유럽 컵대회·ACL은 ESPN(키 없음, 공개 문서 없음, ADR 0029). API-Sports 무료는 지난 시즌만 준다
      - competition: UEL
        source: espn
        league-id: soccer/uefa.europa
      - competition: UECL
        source: espn
        league-id: soccer/uefa.europa.conf
      - competition: FA_CUP
        source: espn
        league-id: soccer/eng.fa
      - competition: EFL_CUP
        source: espn
        league-id: soccer/eng.league_cup
      - competition: COPA_DEL_REY
        source: espn
        league-id: soccer/esp.copa_del_rey
      - competition: COPPA_ITALIA
        source: espn
        league-id: soccer/ita.coppa_italia
      - competition: DFB_POKAL
        source: espn
        league-id: soccer/ger.dfb_pokal
      # ACL은 K리그 구단 대회라 K리그를 닫아 둔 동안 끈다. 코리아컵은 받을 무료 출처가 없어 목록에서 뺐다
      - competition: ACL
        source: espn
        league-id: soccer/afc.champions
        enabled: false
