spring:
  application:
    name: fanchart
  datasource:
    # 세션 상태를 드라이버가 기억해 트랜잭션마다 도는 SET autocommit 왕복을 줄이고, 원장 분개 일괄 저장을 한 문장으로 보낸다.
    # 서버 측 준비문을 캐시한다. 측정과 근거는 docs/performance.md
    url: jdbc:mysql://localhost:3306/teamtrading?useLocalSessionState=true&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250
    username: teamtrading
    password: teamtrading
server:
  port: 8080
# 운영 지표와 상태 확인은 별도 포트(8081)로만 연다. 이 포트는 외부에 공개하지 않고 내부 네트워크의 Prometheus만 읽는다
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: [health, prometheus]
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: [50ms, 100ms, 250ms, 500ms, 1s]
# 경기 일정·결과 수집. 리그마다 제공처와 키를 따로 둔다. 키가 빈 리그만 수집하지 않는다.
# 같은 제공처 키를 여러 리그에 넣어도 된다(football-data 키 하나로 유럽 4개 리그). 리그 번호 확인은 docs/operations.md
fanchart:
  match-feed:
    leagues:
      - league: KBO
        source: api-baseball
        api-key: ${KBO_API_KEY:}
        league-id: "5"
      - league: K_LEAGUE
        source: api-football
        api-key: ${KLEAGUE_API_KEY:}
        league-id: "292"
      - league: LCK
        source: pandascore
        api-key: ${LCK_API_KEY:}
        league-id: "293"
      - league: EPL
        source: football-data
        api-key: ${EPL_API_KEY:}
        league-id: PL
      - league: LA_LIGA
        source: football-data
        api-key: ${LALIGA_API_KEY:}
        league-id: PD
      - league: SERIE_A
        source: football-data
        api-key: ${SERIEA_API_KEY:}
        league-id: SA
      - league: BUNDESLIGA
        source: football-data
        api-key: ${BUNDESLIGA_API_KEY:}
        league-id: BL1
