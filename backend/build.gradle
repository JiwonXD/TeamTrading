plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fanchart'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 이미지에는 실행 가능한 bootJar 하나만 담는다
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'load'
    }
}

// HTTP 주문 부하 테스트. 예: ./gradlew loadTest -Pload.users=100 -Pload.seconds=60
tasks.register('loadTest', Test) {
    description = 'Runs the HTTP order load test and checks the ledger afterwards.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'load'
    }
    ['load.users', 'load.seconds', 'load.teams'].each { key ->
        if (project.hasProperty(key)) systemProperty key, project.property(key)
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}
